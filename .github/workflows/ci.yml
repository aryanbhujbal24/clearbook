name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests: the money arithmetic, the fee schedule, the posting
  # invariants. No Docker, no database, seconds to run — so a mistake in the
  # part that is hardest to get right is reported before anything slower
  # starts.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Unit tests
        run: mvn -B -ntp test

  # Integration tests: real PostgreSQL and real Kafka through Testcontainers.
  # The invariants under test — a deferred constraint trigger firing at
  # COMMIT, a UNIQUE index closing the idempotency race, two transactions
  # actually colliding on a version check — are properties of the real
  # database. An in-memory stand-in would pass while production refused every
  # posting.
  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Integration tests
        run: mvn -B -ntp verify
        env:
          # Testcontainers starts faster when it does not have to probe for a
          # Ryuk container it cannot use on the hosted runners' Docker setup.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # The schema's own invariants, checked without the application at all.
  # Everything here is a property of the DDL: the zero-sum trigger, the
  # idempotency constraint, the CHECKs. Running it separately proves the
  # database is doing the work rather than the Java in front of it.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clearbook_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        run: |
          psql "$URL" -v ON_ERROR_STOP=1 -q -f src/main/resources/db/migration/V1__ledger_core.sql
        env:
          URL: postgresql://postgres:postgres@localhost:5432/clearbook_verify
          PGPASSWORD: postgres

      - name: Verify schema invariants
        run: ./tools/verify-schema.sh "$URL"
        env:
          URL: postgresql://postgres:postgres@localhost:5432/clearbook_verify
          PGPASSWORD: postgres
